name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s tests/python -p 'test_*.py'
      - run: npm install --prefix .audit-tools --no-save --package-lock=false @electric-sql/pglite@0.5.8
      - run: node scripts/test-alert-db.mjs
      - run: node scripts/test-rollout-db.mjs
