name: Frequent Price Check
on:
  schedule:
    # UPDATED: This now runs every 5 minutes
    - cron: '*/5 4-11 * * 1-5'
  workflow_dispatch:

jobs:
  ping-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --max-time 65 -H "Authorization: Bearer $CRON_SECRET" "https://psx-45-naeh.vercel.app/api/run-alerts"
