name: Sync market headlines
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-public-market-reports
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          ref: codex/market-data
          path: reports
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public headline metadata
        id: sync
        continue-on-error: true
        run: node app/scripts/sync-market-news.mjs reports
      - name: Publish successful update
        working-directory: reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh market headline links'
            git push origin HEAD:codex/market-data
          fi
      - name: Report failed collection
        if: steps.sync.outcome == 'failure'
        run: exit 1
