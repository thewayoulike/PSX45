name: Sync MUFAP Fund NAV

on:
  schedule:
    # Weekdays: after typical AMC publish (6 PM PKT) and a late retry (9 PM PKT)
    - cron: '0 13 * * 1-5'
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install playwright xlsx --no-save
          npx playwright install --with-deps chromium

      - name: Sync MUFAP NAV catalog
        run: node scripts/sync-mufap-nav.mjs
        env:
          MUFAP_LOOKBACK_DAYS: '5'

      - name: Commit updated catalog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync MUFAP fund NAV catalog'
          file_pattern: |
            data/fund-nav-catalog.json
            public/data/fund-nav-catalog.json

      - name: Email owner on failure
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          MUFAP_SYNC_ALERT_EMAIL: ${{ secrets.MUFAP_SYNC_ALERT_EMAIL }}
        run: node scripts/notify-mufap-sync-failure.mjs
