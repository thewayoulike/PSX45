name: Sync MUFAP Fund NAV

on:
  schedule:
    # Weekdays: after typical AMC publish (6 PM PKT) and a late retry (9 PM PKT)
    - cron: '0 13 * * 1-5'
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install playwright xlsx --no-save
          npx playwright install --with-deps chromium

      - name: Sync MUFAP NAV catalog
        run: node scripts/sync-mufap-nav.mjs
        env:
          MUFAP_LOOKBACK_DAYS: '5'

      - name: Commit updated catalog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync MUFAP fund NAV catalog'
          file_pattern: |
            data/fund-nav-catalog.json
            public/data/fund-nav-catalog.json

      - name: Notify on failure
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.MUFAP_SYNC_ALERT_WEBHOOK }}
          SUPPORT_EMAIL: ${{ secrets.MUFAP_SYNC_ALERT_EMAIL }}
        run: |
          set -e
          MSG="PSX Tracker MUFAP NAV sync FAILED on ${GITHUB_REPOSITORY} run ${GITHUB_RUN_ID} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          echo "::error::$MSG"
          if [ -n "$ALERT_WEBHOOK" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
              "$ALERT_WEBHOOK" || true
          fi
          if [ -n "$SUPPORT_EMAIL" ]; then
            echo "Configure mail relay separately; failure recorded for $SUPPORT_EMAIL"
          fi
