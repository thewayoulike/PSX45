name: Sync MUFAP Fund NAV

on:
  schedule:
    # Weekdays: after typical AMC publish (6 PM PKT) and a late retry (9 PM PKT)
    - cron: '0 13 * * 1-5'
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# Overlapping runs would race on the same commit.
concurrency:
  group: sync-mufap-nav
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci
          npm install playwright --no-save --package-lock=false
          npx playwright install --with-deps chromium

      - name: Sync MUFAP NAV catalog
        run: node scripts/sync-mufap-nav.mjs
        env:
          MUFAP_LOOKBACK_DAYS: '5'
          MUFAP_WRITE_EXCEL: '0'

      - name: Commit updated catalog
        run: node scripts/publish-mufap-catalog.mjs

      - name: Email owner on failure
        if: failure()
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          MUFAP_SYNC_ALERT_EMAIL: ${{ secrets.MUFAP_SYNC_ALERT_EMAIL }}
        run: node scripts/notify-mufap-sync-failure.mjs
